<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartPark parking entry poster</title>
<style>
@page{size:A4;margin:0}body{font-family:Arial,sans-serif;width:210mm;min-height:297mm;margin:0;color:#203026;display:grid;place-items:center;background:#eef4ea}.poster{width:170mm;min-height:245mm;background:#fff;text-align:center;padding:18mm;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.logo{font-size:26px;font-weight:800}.logo span{color:#84b94f}.mark{width:44px;height:44px;border-radius:50%;background:#84b94f;color:#fff;display:inline-grid;place-items:center;margin-right:8px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#759169;margin-top:20mm}.poster h1{font-size:40px;line-height:1.05;margin:8mm 0 4mm}.poster p{font-size:17px;color:#708077}.qr{width:120mm;height:120mm;border:10mm solid white;box-shadow:0 8px 30px #20302618}.url{font-family:monospace;font-size:12px;word-break:break-all;color:#5e6d62}.foot{font-size:11px;color:#849087}
</style>
</head>
<body><main class="poster"><div class="logo"><span class="mark">S</span>smart<span>park</span></div><div><div class="eyebrow">Parking lot entry</div><h1>Scan to find<br>your parking space</h1><p>Open SmartPark in your phone browser.<br>No app or visitor login required.</p></div><img class="qr" src="/api/public/sites/default/qr?format=svg" alt="SmartPark visitor QR code"><div><div class="url">https://your-domain/scan/default</div><p class="foot">Set your real HTTPS domain before printing this parking entry QR code.</p></div></main></body></html>
